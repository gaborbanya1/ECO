<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eco Gong - Timed Meditation</title>
    <meta name="description" content="A minimalist, earthy meditation timer with recurring gongs and night mode." />
    <!-- Removed leading slash so GitHub Pages can find it -->
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#4A6741" />
    
    <!-- Updated path to the iOS 192px icon -->
    <link rel="apple-touch-icon" href="appstore-images/ios/192.png" />
    
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta property="og:title" content="Eco Gong - Timed Meditation" />
    <meta property="og:description" content="A minimalist, earthy meditation timer with recurring gongs and night mode." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <!-- Removed leading slash -->
    <script type="module" src="src/main.tsx"></script>
    
    <!-- Added the required Service Worker registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('sw.js').then(registration => {
            console.log('ServiceWorker registered');
          }).catch(error => {
            console.log('ServiceWorker registration failed: ', error);
          });
        });
      }
    </script>
  </body>
</html>
